services:
  - type: web
    name: catalogo-virtual
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__Default
        sync: false
      - key: Supabase__Url
        sync: false
      - key: Supabase__ServiceKey
        sync: false
      # Credencial do dono, semeada na primeira subida (ADR-006). Nunca versionada.
      - key: Owner__UserName
        sync: false
      - key: Owner__Password
        sync: false
